<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>冒険スタート</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<!-- ゲストプレイ表示 -->
<p th:if="${isGuest}" class="guest-label">（ゲストプレイ中）</p>

<div class="container">

  <!-- ストーリー本文 -->
  <p class="story-text" th:text="${scene.message}">ここにストーリーテキスト</p>

  <!-- 選択肢がある場合のみ -->
  <div th:if="${#lists.size(scene.choices) > 0}">

    <form th:action="${isGuest} ? @{/guest/choice} : @{/choice}" method="post">
      <input type="hidden" name="currentScene" th:value="${scene.id}" />
      <input type="hidden" name="previousScene" th:value="${scene.previousSceneId}" />

      <div class="choice-list" th:each="c : ${scene.choices}">
        <button class="choice-btn" type="submit" name="selected" th:value="${c}"
                th:text="${c}">選択肢</button>
      </div>

    </form>
  </div>

  <!-- 選択肢が空（＝ゲーム終了） -->
  <div th:if="${#lists.isEmpty(scene.choices)}" class="end-section">
    <p>ゲーム終了です。お疲れさまでした！</p>
    <a th:href="@{/home}" class="btn">ホームに戻る</a>
  </div>

</div>

</body>
</html>
