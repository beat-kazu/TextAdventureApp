<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>ユーザ登録</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="container">

  <h1 class="title">新規ユーザ登録</h1>

  <form th:action="@{/register}" method="post" th:object="${player}">
    <p class="description">
      ニックネームと好きな食べ物は、ゲーム内メッセージに使用されます。
    </p>
    <label>ユーザー名</label>
    <input type="text" class="input-field" th:field="*{username}" />

    <label>パスワード</label>
    <input type="password" class="input-field" th:field="*{password}" />

    <label>ニックネーム</label>
    <input type="text" class="input-field" th:field="*{nickname}" />

    <label>好きな食べ物</label>
    <input type="text" class="input-field" th:field="*{favorite}" />

    <!-- login.html と同じ青いボタンを使用 -->
    <button type="submit" class="btn">登録</button>
  </form>

  <p th:text="${message}" style="color: #ff6f6f; margin-top: 10px;"></p>

  <div class="sub-links">
    <a href="/login">ログインへ戻る</a>
  </div>

</div>

</body>
</html>
